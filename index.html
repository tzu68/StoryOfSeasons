<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遊戲小幫手</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="images/icon.png">
    <link rel=" apple-touch-icon" href="images/icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="images/icon.png">
</head>

<body>
    <header>
        <h1>遊戲小幫手</h1>
        <nav>
            <ul>
                <li><a href="#calendar">行事曆</a></li>
                <li><a href="#residents">結婚候補資訊</a></li>
                <li><a href="#cooking">賺錢料理</a></li>
                <li><a href="#crops">作物</a></li>
                <li><a href="#windmill">風車加工</a></li>
                <li><a href="#fishing">釣魚與捕蟲</a></li>
                <li><a href="#animals">動物外觀</a></li>
                <li><a href="#minerals">礦物分布</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- 行事曆 -->
        <section>
            <div class="content" id="calendar">
                <h2>行事曆</h2>
                <div class="calendarCard" id="interactive-calendar">
                    <!-- JavaScript 生成互動式行事曆 -->
                </div>
            </div>
        </section>

        <!-- 礦物分布 -->
        <section>
            <div class="content" id="minerals">
                <h2>礦物分布</h2>
                <p>這裡的圖片來自於 予樂</p>
                <div class="tabs">
                    <button data-season="spring">春季</button>
                    <button data-season="summer">夏季</button>
                    <button data-season="fall">秋季</button>
                    <button data-season="winter">冬季</button>
                </div>
                <div id="mineral-gallery">
                    <img src="images/stone/spring_mountain.png" alt="Spring Mountain">
                    <img src="images/stone/spring_town.png" alt="Spring Town">
                </div>
            </div>
        </section>

        <!-- 結婚候補資訊 -->
        <section>
            <div class="content" id="residents">
                <h2>結婚候補資訊</h2>
                <div id="resident-cards">
                    <!-- JavaScript 生成居民卡片 -->
                </div>
            </div>
        </section>

        <!-- 賺錢料理 -->
        <section>
            <div class="content" id="cooking">
                <h2>賺錢料理</h2>
                <p id="cooking-source"></p>
                <div id="cooking-cards">
                    <!-- JavaScript 生成料理卡片 -->
                </div>
                <div id="cooking-tips">
                    <!-- JavaScript 生成製作建議 -->
                </div>
            </div>
        </section>

        <!-- 作物 -->
        <section>
            <div class="content" id="crops">
                <h2>作物</h2>
                <p class="data-source" id="crops-source"></p>
                <h3>季節總覽</h3>
                <div class="table-wrapper">
                    <table class="data-table" id="crops-overview">
                        <!-- JavaScript 生成季節總覽表 -->
                    </table>
                </div>
                <h3>詳細資料</h3>
                <div class="table-wrapper">
                    <table class="data-table" id="crops-detail">
                        <!-- JavaScript 生成作物詳細資料 -->
                    </table>
                </div>
            </div>
        </section>

        <!-- 風車加工 -->
        <section>
            <div class="content" id="windmill">
                <h2>風車加工</h2>
                <p class="data-source" id="windmill-source"></p>
                <div class="tabs" id="windmill-tabs">
                    <!-- JavaScript 生成風車切換按鈕 -->
                </div>
                <div class="table-wrapper">
                    <table class="data-table" id="windmill-table">
                        <!-- JavaScript 生成風車加工表 -->
                    </table>
                </div>
            </div>
        </section>

        <!-- 釣魚與捕蟲 -->
        <section>
            <div class="content" id="fishing">
                <h2>釣魚與捕蟲</h2>
                <p class="data-source" id="fishing-source"></p>
                <div class="tabs" id="fishing-type-tabs">
                    <button data-type="fish">魚</button>
                    <button data-type="bugs">蟲</button>
                </div>
                <div class="tabs" id="fishing-season-tabs">
                    <button data-season="">全部</button>
                    <button data-season="春">春</button>
                    <button data-season="夏">夏</button>
                    <button data-season="秋">秋</button>
                    <button data-season="冬">冬</button>
                </div>
                <div class="table-wrapper">
                    <table class="data-table" id="fishing-table">
                        <!-- JavaScript 生成魚／蟲列表 -->
                    </table>
                </div>
            </div>
        </section>

        <!-- 動物外觀 -->
        <section>
            <div class="content" id="animals">
                <h2>動物外觀</h2>

                <div class="animal-gallery-container">
                    <button class="scroll-btn left">←</button>
                    <div class="animal-gallery">
                        <img src="images/animals/animal01.png" alt="Animal 1" />
                        <img src="images/animals/animal02.png" alt="Animal 2" />
                        <img src="images/animals/animal03.png" alt="Animal 3" />
                    </div>
                    <button class="scroll-btn right">→</button>
                </div>
            </div>
        </section>


    </main>

    <footer>
        <p>© 2025 牧場物語 風之市集</p>
    </footer>

    <script src="scripts.js"></script>
</body>

</html>
